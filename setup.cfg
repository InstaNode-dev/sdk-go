# diff-cover configuration
# https://github.com/Bachmann1234/diff-cover
#
# examples/*/main.go files contain package main entry points whose main()
# functions are untestable via `go test` (the test framework replaces the
# main entry point and os.Exit terminates the process). All business logic
# is extracted into realMain() which IS 100% covered by the test suite.
[diff_cover]
exclude_patterns =
    examples/*/main.go
